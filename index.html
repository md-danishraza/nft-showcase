<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/ico" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Primary Meta Tags -->
    <!-- Make the title catchy but descriptive -->
    <title>NFTme | Discover the Best NFT Collections</title>
    <meta name="title" content="NFTme | Discover the Best NFT Collections" />
    <meta
      name="description"
      content="Join the community and get the best NFT collection. Discover unique Bitcoin-inspired digital artworks from top creators around the world."
    />
    <meta
      name="keywords"
      content="NFT, Crypto, Bitcoin Art, Digital Art, Marketplace, Web3"
    />
    <meta name="author" content="NFTme" />

    <!-- 2. Open Graph / Facebook / Discord -->
    <!-- These control how your link looks when shared on most social platforms -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nft-ui-showcase.netlify.app/" />
    <meta
      property="og:title"
      content="NFTme | Discover the Best NFT Collections"
    />
    <meta
      property="og:description"
      content="Join the community and get the best NFT collection. Discover unique Bitcoin-inspired digital artworks from top creators around the world."
    />
    <!-- Add a cool screenshot of your site to the public folder and link it here -->
    <meta property="og:image" content="/social-preview.jpg" />

    <!-- 3. Twitter -->
    <!-- 'summary_large_image' ensures your link preview gets a big, full-width image -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://nft-ui-showcase.netlify.app/"
    />
    <meta
      property="twitter:title"
      content="NFTme | Discover the Best NFT Collections"
    />
    <meta
      property="twitter:description"
      content="Join the community and get the best NFT collection. Discover unique Bitcoin-inspired digital artworks from top creators around the world."
    />
    <meta property="twitter:image" content="/social-preview.jpg" />

    <!-- 4. Theme Color -->
    <!-- This colors the browser tab bar on mobile devices to match your dark theme -->
    <meta name="theme-color" content="#0D0B0C" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
